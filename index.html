<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="依國家海洋研究院《海洋科學序列教材 G3–G5 初階海洋素養》設計的學生互動遊戲。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>海洋科學調查筆記本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: an investigation notebook — station track on top, lined working sheet on the left, concept wall pinned on the right */
:root{
  --paper:#e9f3f5; --sheet:#ffffff; --rule:#d5e7ec; --ink:#14324a; --muted:#587386;
  --sea:#2477a8; --sea-soft:#d6ebf5; --land:#d8b259; --land-soft:#f6ecd0;
  --coral:#e2593a; --coral-ink:#ffffff; --ok:#23845a; --ok-soft:#dcf1e6; --warn:#b5531c; --warn-soft:#fbe7da;
  --note:#fff4b8; --note-ink:#4a3d00;
  --globe-sea:#3a8fc1; --globe-grid:rgba(255,255,255,.22); --globe-land:#e3c372; --globe-land-edge:#9d7b2a; --globe-rim:#1c5c84;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1922; --sheet:#0f2533; --rule:#1b3a4c; --ink:#e2eef3; --muted:#91acbb;
  --sea:#5fb3e3; --sea-soft:#163a50; --land:#e0bd68; --land-soft:#3a3016;
  --coral:#ff7d57; --coral-ink:#1a0d07; --ok:#5ccf93; --ok-soft:#123826; --warn:#f0965e; --warn-soft:#3d2414;
  --note:#4a4214; --note-ink:#fff3b0;
  --globe-sea:#1f6694; --globe-grid:rgba(255,255,255,.14); --globe-land:#cfa84e; --globe-land-edge:#7d6020; --globe-rim:#5fb3e3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1922; --sheet:#0f2533; --rule:#1b3a4c; --ink:#e2eef3; --muted:#91acbb;
  --sea:#5fb3e3; --sea-soft:#163a50; --land:#e0bd68; --land-soft:#3a3016;
  --coral:#ff7d57; --coral-ink:#1a0d07; --ok:#5ccf93; --ok-soft:#123826; --warn:#f0965e; --warn-soft:#3d2414;
  --note:#4a4214; --note-ink:#fff3b0;
  --globe-sea:#1f6694; --globe-grid:rgba(255,255,255,.14); --globe-land:#cfa84e; --globe-land-edge:#7d6020; --globe-rim:#5fb3e3;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:17px;line-height:1.7;padding-inline:16px;padding-block:0 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:30px;color:var(--sea)}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.04em}
.top .spacer{flex:1}
.who{font-size:14px;color:var(--muted)}
.btn-plain{background:none;border:1.5px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.btn-plain:hover{border-color:var(--sea)}

/* station track */
.track{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:thin}
.st{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;cursor:pointer;white-space:nowrap}
.st .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:13px}
.st.done .n{background:var(--ok);color:var(--sheet)}
.st.cur{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea-soft)}
.st:disabled{opacity:.45;cursor:not-allowed}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--sheet);border-radius:var(--r);padding:24px clamp(16px,3vw,32px);min-width:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 70px;border:1px solid var(--rule)}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px;background:var(--sheet)}
.sheet-head h2{font-size:28px}
.ref{font-size:12.5px;color:var(--muted);border:1px dashed var(--rule);border-radius:6px;padding:1px 8px;background:var(--sheet)}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:16px 18px}
.q{font-family:var(--font-display);font-size:22px;color:var(--ink);background:var(--sheet)}
.muted{color:var(--muted)}
p{margin:0}

/* guide character */
.guide{display:flex;gap:14px;align-items:flex-start}
.guide svg{flex:0 0 56px}
.bubble{position:relative;background:var(--sea-soft);border-radius:14px;padding:12px 16px;min-width:0}
.bubble b{color:var(--sea)}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--coral);color:var(--coral-ink);font-size:16px}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--sea);color:var(--sheet)}
.btn.ghost{background:var(--sheet);color:var(--sea);border:2px solid var(--sea)}
.choice{border:2px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px 18px;cursor:pointer;font-size:17px;font-weight:500}
.choice:hover{border-color:var(--sea)}
.choice.on{border-color:var(--sea);background:var(--sea-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--warn);background:var(--warn-soft)}
.chip{border:1.5px dashed var(--sea);background:var(--sheet);color:var(--sea);border-radius:999px;padding:3px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--sea);color:var(--sheet);border-style:solid}

.fb{border-radius:10px;padding:10px 14px;font-size:16px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.fb.info{background:var(--sea-soft);border-left:4px solid var(--sea)}

textarea,input[type=text]{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);line-height:1.7}
textarea{min-height:140px;resize:vertical;background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--rule) 28px 29px);background-attachment:local;background-position:0 10px}
textarea:focus,input:focus{border-color:var(--sea);outline:none}

/* worksheet A-D */
.abcd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.abcd button{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;padding:10px}
.abcd svg{width:100%;height:auto}
.abcd .lab{font-family:var(--font-display);font-size:20px}

/* sort cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.card.right{border-color:var(--ok);background:var(--ok-soft)}
.card.wrong{border-color:var(--warn);background:var(--warn-soft)}
.card .row .choice{padding:6px 12px;font-size:15px}

/* globe */
.globe-area{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.globe-area{grid-template-columns:1fr}}
.globe-host{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.globe-box{width:100%;display:flex;justify-content:center}
.globe-canvas{touch-action:none;cursor:grab;display:block;max-width:100%}
.globe-canvas.drawmode{cursor:crosshair}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px}
.tab.on{background:var(--sea);border-color:var(--sea);color:var(--sheet)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.meter{height:18px;border-radius:999px;background:var(--land);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--sea);transition:width .2s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.big{font-family:var(--font-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.targets{display:flex;flex-wrap:wrap;gap:8px}
.tg{border-radius:999px;padding:3px 12px;font-size:15px;border:1.5px solid var(--rule)}
.tg.cur{border-color:var(--coral);color:var(--coral);font-weight:700}
.tg.done{background:var(--ok-soft);border-color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.pad button{height:40px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:16px}

/* tally */
.tally{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;font-variant-numeric:tabular-nums}
.tally .marks{font-family:"Noto Sans TC",serif;font-size:26px;letter-spacing:.08em;word-break:break-all;line-height:1.3;min-width:0}
.tally .lbl{font-weight:700}
.tally .lbl.land{color:var(--warn)}
.tally .lbl.sea{color:var(--sea)}
.chart{width:100%;height:auto;max-width:520px}

/* aside */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.side{position:static}}
.wall{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.wall h3{font-size:19px;margin-bottom:10px}
.concept{border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.5;margin-bottom:8px;border:1.5px dashed var(--rule);color:var(--muted)}
.concept.got{background:var(--note);color:var(--note-ink);border:none;font-weight:700;transform:rotate(-.6deg);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.concept.got:nth-child(odd){transform:rotate(.7deg)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px dashed var(--rule);color:var(--muted)}
.badge.got{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{border-radius:6px;padding:2px 10px;font-size:14px;border:1.5px solid var(--rule);color:var(--muted)}
.vocab span.got{border-color:var(--sea);color:var(--sea);font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,20,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--sheet);border-radius:16px;max-width:560px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.dlg .concept.got{font-size:22px;text-align:center;padding:18px;font-family:var(--font-display);font-weight:400}
.nb-item{border-bottom:1px solid var(--rule);padding-block:8px}
.nb-item h4{margin:0 0 4px;font-size:15px;color:var(--sea)}
.nb-item p{white-space:pre-wrap}

.timer{display:flex;align-items:center;gap:12px}
.timer svg{width:64px;height:64px}
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:760px){.cover{grid-template-columns:1fr}}
.cover h2{font-size:clamp(40px,7vw,64px);color:var(--sea);letter-spacing:.04em}
.plan{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.plan .t{color:var(--muted)}


/* site shell */
.brand a{color:inherit;text-decoration:none}
.home{display:flex;flex-direction:column;gap:22px;padding-block:8px 24px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:28px clamp(16px,3vw,36px)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(34px,5vw,52px);color:var(--sea);letter-spacing:.03em}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.units{grid-template-columns:1fr}}
.ucol{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ucol h3{font-size:20px}
.ucol .sub{font-size:13px;color:var(--muted);letter-spacing:.04em}
.lesson{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;font-size:15px;background:var(--sheet);text-align:left;color:var(--muted)}
.lesson .no{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.2em}
.lesson.open{border-color:var(--sea);color:var(--ink);cursor:pointer;background:var(--sea-soft)}
.lesson.open:hover{border-color:var(--coral)}
.lesson .pg{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:0 8px;white-space:nowrap}
.lesson.open .pg{background:var(--sheet);color:var(--sea)}
.lesson .pg.done{background:var(--ok);color:var(--sheet)}
.lesson .soon{margin-left:auto;font-size:12px}
/* 2.1 additions */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.org{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;position:relative}
.org:hover{border-color:var(--sea)}
.org svg{width:100%;height:auto;max-width:120px}
.org.seen{background:var(--sea-soft)}
.org .tag{position:absolute;top:4px;right:6px;font-size:11px;border-radius:999px;padding:0 6px;font-weight:700}
.org .tag.k{background:var(--ok);color:var(--sheet)}
.org .tag.n{background:var(--coral);color:var(--coral-ink)}
.detail{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.detail{grid-template-columns:1fr}}
.detail svg{width:100%;height:auto;background:var(--sea-soft);border-radius:12px}
.need-chart{border:2px solid var(--sea);border-radius:12px;padding:14px 16px;background:var(--sheet)}
.need-chart h4{font-family:var(--font-display);font-weight:400;text-align:center;margin:0 0 8px;font-size:22px;text-decoration:underline;text-underline-offset:6px}
.need-cols{display:grid;grid-template-columns:1fr 1fr}
.need-cols>div{padding:0 12px;min-width:0}
.need-cols>div+div{border-left:2px solid var(--ink)}
.need-cols h5{margin:0 0 6px;font-size:16px;text-align:center;color:var(--muted);font-weight:500}
.need-cols ul{margin:0;padding-left:1.1em;font-family:var(--font-display);font-size:17px;line-height:1.8}
.need-cols li.new{color:var(--sea)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.breath{width:120px;height:120px;border-radius:50%;background:var(--sea-soft);border:3px solid var(--sea);display:grid;place-items:center;font-family:var(--font-display);font-size:18px;transition:transform 3s ease-in-out}
.breath.in{transform:scale(1.35)}
.listbox{display:flex;flex-wrap:wrap;gap:6px}
.listbox span{background:var(--sea-soft);border-radius:999px;padding:2px 12px;font-size:15px}
.sortcol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:10px;padding:4px 8px;background:var(--sheet)}
.mini svg{width:54px;height:36px;flex:0 0 54px}
.mini.right{border-color:var(--ok);background:var(--ok-soft)}
.mini.wrong{border-color:var(--warn);background:var(--warn-soft)}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}

/* 海博士 AI */
.ai-box{border:2px solid var(--sea);border-radius:14px;background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-head{display:flex;align-items:center;gap:10px}
.ai-head b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--sea)}
.ai-tag{font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:1px 8px;background:var(--sea);color:var(--sheet)}
.ai-q{font-size:19px}
.ai-thread{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg svg{flex:0 0 32px;width:32px;height:32px}
.msg .bub{border-radius:14px;padding:9px 14px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.msg.d .bub{background:var(--sea-soft);border-bottom-left-radius:4px}
.msg.s{justify-content:flex-end}
.msg.s .bub{background:var(--note);color:var(--note-ink);border-bottom-right-radius:4px;max-width:85%}
.ai-more{flex-wrap:nowrap}
.ai-more input{flex:1;min-width:0}
.ai-more .btn{flex:0 0 auto}
.ai-note{font-size:12.5px;color:var(--muted)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sea);opacity:.35;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.ai-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:6px 18px 6px 6px;background:var(--coral);color:var(--coral-ink);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ai-fab svg{width:36px;height:36px}
.ai-panel{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:16;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));background:var(--sheet);border:1.5px solid var(--sea);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.ai-ph{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule);background:var(--sea-soft)}
.ai-ph b{font-family:var(--font-display);font-weight:400;font-size:18px}
.ai-ph .btn-plain{margin-left:auto}
.ai-panel .ai-thread{flex:1;overflow-y:auto;padding:12px}
.ai-panel .ai-more{border-top:1px solid var(--rule)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><a href="#home" id="brandTitle">海洋科學調查筆記本</a></h1><small id="brandSub">海洋科學序列教材 G3–G5 初階海洋素養</small></div>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn-plain" id="homeBtn" hidden>單元選單</button>
    <button class="btn-plain unit-only" id="nbBtn" hidden>我的筆記本</button>
    <button class="btn-plain unit-only" id="reset" hidden>重新開始</button>
  </header>
  <section id="home" class="home"></section>
  <section id="unitView" hidden>
    <nav class="track" id="track" aria-label="調查路線"></nav>
    <div class="grid">
      <main class="sheet" id="stage"><p class="muted">載入中……</p></main>
      <aside class="side">

function oceanName(lon, lat) {
  lon = normLon(lon);
  if (lon > 46.5 && lon < 55.5 && lat > 36.5 && lat < 47.5) return '裏海';
  if (lat >= 70) return '北極海';
  if (lat >= 66) return (lon > -45 && lon < 25) ? '大西洋' : '北極海';
  if (lat <= -60) return '南冰洋';
  if (lat >= 0) {
    const b = lat < 9 ? -78 : lat < 14 ? -84 : lat < 18.5 ? -92 : -100;
    if (lon < b || lon >= 100) return '太平洋';
    if (lon < 20) return '大西洋';
    if (lon < 45 && lat >= 30) return '大西洋';
    if (lat < 30) return '印度洋';
    return '大西洋';
  }
  const west = lat > -56 ? -69.5 : -67;
  if (lon >= west && lon < 20) return '大西洋';
  if (lon >= 20 && lon < 147) {
    if (lat > -8 && lon >= 105) return '太平洋';
    if (lon >= 129 && lat > -18) return '太平洋';
    return '印度洋';
  }
  return '太平洋';
}
const randomLL = () => [Math.random() * 360 - 180, Math.asin(2 * Math.random() - 1) * 180 / Math.PI];

/* ---------- 地球儀元件 ---------- */
class Globe {
  constructor(host, o = {}) {
    this.o = o; this.host = host;
    this.c = document.createElement('canvas'); this.c.className = 'globe-canvas';
    this.c.setAttribute('role', 'img'); this.c.setAttribute('aria-label', '可以拖曳轉動的地球儀');
    host.appendChild(this.c); this.g = this.c.getContext('2d');
    this.rot = o.rot || [-121, -15, 0];
    this.p = d3.geoOrthographic().clipAngle(90).precision(0.4);
    this.path = d3.geoPath(this.p, this.g); this.grat = d3.geoGraticule10();
    this.markers = []; this.lines = []; this.live = null; this.mode = 'rotate'; this.finger = false; this.locked = false;
    this.size(); this.bind();
    this.ro = new ResizeObserver(() => { if (this.size()) this.draw(); }); this.ro.observe(host);
    this.draw();
  }
  size() {
    const w = Math.floor(this.host.clientWidth || 320); const s = Math.max(240, Math.min(w, this.o.max || 500));
    if (s === this.S) return false;
    this.dpr = window.devicePixelRatio || 1; this.S = s; this.R = s / 2 - 6;
    this.c.style.width = s + 'px'; this.c.style.height = s + 'px'; this.c.width = s * this.dpr; this.c.height = s * this.dpr;
    this.p.translate([s / 2, s / 2]).scale(this.R); return true;
  }
  center() { return [normLon(-this.rot[0]), -this.rot[1]]; }
  visible(ll) { return d3.geoDistance(ll, this.center()) < Math.PI / 2 - 0.02; }
  pt(e) { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  ll(pt, clamp) {
    let [x, y] = pt; const cx = this.S / 2, dx = x - cx, dy = y - cx, d = Math.hypot(dx, dy);
    if (d > this.R) { if (!clamp) return null; x = cx + dx / d * this.R * 0.97; y = cx + dy / d * this.R * 0.97; }
    this.p.rotate(this.rot); return this.p.invert([x, y]);
  }
  bind() {
    const c = this.c; let st = null;
    c.addEventListener('pointerdown', e => {
      if (this.locked) return; c.setPointerCapture(e.pointerId);
      const pt = this.pt(e); st = { x: pt[0], y: pt[1], t: performance.now(), r0: [...this.rot], moved: false, pt };
      if (this.mode === 'draw' && this.o.onDrawStart) { this.ptr = pt; if (this.o.onDrawStart(this, pt)) { this.drawing = true; this.loop(); } }
    });
    c.addEventListener('pointermove', e => {
      if (!st) return; const pt = this.pt(e); const dx = pt[0] - st.x, dy = pt[1] - st.y;
      if (Math.hypot(dx, dy) > 6) st.moved = true;
      if (this.mode === 'draw') { if (this.drawing) { this.ptr = pt; this.o.onDrawMove && this.o.onDrawMove(this, pt); } return; }
      if (st.moved && !this.locked && !this.o.noDrag) {
        const k = 90 / this.R;
        this.rot = [st.r0[0] + dx * k, Math.max(-85, Math.min(85, st.r0[1] - dy * k)), 0];
        this.draw(); this.o.onRotate && this.o.onRotate(this);
      }
    });
    const end = () => {
      if (!st) return;
      if (this.mode === 'draw') { if (this.drawing) { this.drawing = false; this.o.onDrawEnd && this.o.onDrawEnd(this); } }
      else if (!st.moved && performance.now() - st.t < 600) { const ll = this.ll(st.pt); if (ll && this.o.onTap) this.o.onTap(ll, this); }
      st = null;
    };
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  }
  loop() {
    const step = () => {
      if (!this.drawing) return;
      const [x, y] = this.ptr, cx = this.S / 2, dx = x - cx, dy = y - cx, d = Math.hypot(dx, dy);
      if (d > this.R * 0.66) {
        const k = Math.min(1.5, (d - this.R * 0.66) / (this.R * 0.3) * 1.5);
        this.rot = [this.rot[0] - dx / d * k, Math.max(-85, Math.min(85, this.rot[1] + dy / d * k)), 0];
        this.o.onDrawMove && this.o.onDrawMove(this, this.ptr);
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  nudge(dl, dp) { this.rot = [this.rot[0] + dl, Math.max(-85, Math.min(85, this.rot[1] + dp)), 0]; this.draw(); this.o.onRotate && this.o.onRotate(this); }
  spinTo(ll, ms = 1800, turns = 1) {
    return new Promise(res => {
      const r0 = [...this.rot]; let l1 = -ll[0]; const base = r0[0] + turns * 360 * (Math.random() < .5 ? 1 : -1);
      l1 = l1 + 360 * Math.round((base - l1) / 360); const p1 = -ll[1];
      if (reduceMotion()) ms = 250;
      const t0 = performance.now(); this.locked = true;
      const f = t => {
        const u = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - u, 3);
        this.rot = [r0[0] + (l1 - r0[0]) * e, r0[1] + (p1 - r0[1]) * e, 0]; this.draw();
        if (u < 1) requestAnimationFrame(f); else { this.locked = false; this.o.onRotate && this.o.onRotate(this); res(); }
      };
      requestAnimationFrame(f);
    });
  }
  stats(n = 26) {
    const out = { land: 0, ocean: 0, names: {} }; const cx = this.S / 2; this.p.rotate(this.rot);
    for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) {
      const x = (i / n) * 2 - 1, y = (j / n) * 2 - 1; if (x * x + y * y > 1) continue;
      const ll = this.p.invert([cx + x * this.R, cx + y * this.R]); if (!ll) continue;
      if (isLand(ll[0], ll[1])) out.land++; else { out.ocean++; const nm = oceanName(ll[0], ll[1]); out.names[nm] = (out.names[nm] || 0) + 1; }
    }
    out.pct = Math.round(out.ocean / (out.ocean + out.land) * 100); return out;
  }
  draw() {
    const g = this.g, cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); g.clearRect(0, 0, this.S, this.S); this.p.rotate(this.rot);
    g.beginPath(); this.path({ type: 'Sphere' }); g.fillStyle = col('--globe-sea'); g.fill();
    g.beginPath(); this.path(this.grat); g.strokeStyle = col('--globe-grid'); g.lineWidth = .7; g.stroke();
    g.beginPath(); this.path(LAND); g.fillStyle = col('--globe-land'); g.fill(); g.strokeStyle = col('--globe-land-edge'); g.lineWidth = .8; g.stroke();
    const gr = g.createRadialGradient(this.S * .36, this.S * .32, this.R * .05, this.S / 2, this.S / 2, this.R);
    gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(.6, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.25)');
    g.beginPath(); this.path({ type: 'Sphere' }); g.fillStyle = gr; g.fill(); g.strokeStyle = col('--globe-rim'); g.lineWidth = 2.5; g.stroke();
    for (const L of [...this.lines, this.live].filter(Boolean)) {
      if (L.pts.length < 2) continue;
      g.beginPath(); this.path({ type: 'LineString', coordinates: L.pts });
      g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 7; g.stroke();
      g.strokeStyle = L.color; g.lineWidth = 4.5; g.stroke();
    }
    g.font = '600 14px ' + col('--font-body');
    for (const m of this.markers) {
      if (!this.visible(m.ll)) continue; const [x, y] = this.p(m.ll);
      g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fillStyle = col('--coral'); g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
      const w = g.measureText(m.label).width + 14; g.fillStyle = 'rgba(255,255,255,.92)';
      g.beginPath(); g.roundRect ? g.roundRect(x + 9, y - 13, w, 24, 6) : g.rect(x + 9, y - 13, w, 24); g.fill();
      g.fillStyle = '#14324a'; g.fillText(m.label, x + 16, y + 4);
    }
    if (this.finger) {
      const c = this.S / 2; g.lineWidth = 3; g.strokeStyle = '#fff';
      g.beginPath(); g.arc(c, c, 13, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(c - 22, c); g.lineTo(c - 8, c); g.moveTo(c + 8, c); g.lineTo(c + 22, c); g.moveTo(c, c - 22); g.lineTo(c, c - 8); g.moveTo(c, c + 8); g.lineTo(c, c + 22); g.stroke();
      g.beginPath(); g.arc(c, c, 4, 0, Math.PI * 2); g.fillStyle = col('--coral'); g.fill();
    }
    this.o.onDraw && this.o.onDraw(this);
  }
  destroy() { this.ro.disconnect(); }
}

function wsSVG(land, sea) {
  const W = 200, H = 90, x = W * land / 100;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.2"/>
    <rect x="${x}" y="50" width="${W - x - 1}" height="${H - 51}" fill="var(--sea-soft)"/>
    <path d="M1 40 Q${x * .3} 36 ${x * .55} 42 T${x} 50" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
    <path d="M${x} 50 ${Array.from({ length: Math.max(1, Math.floor((W - x) / 12)) }, (_, i) => `q3 -4 6 0 q3 4 6 0`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1"/>
    <line x1="${x}" y1="4" x2="${x}" y2="${H - 2}" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="${x / 2}" y="24" text-anchor="middle" font-size="12" fill="var(--ink)">${land}% 陸地</text>
    <text x="${x + (W - x) / 2}" y="24" text-anchor="middle" font-size="12" fill="var(--sea)">${sea}% 海水</text></svg>`;
}

    if (mp) { mp.textContent = st.pct; $('#ml').textContent = 100 - st.pct; $('#mi').style.width = st.pct + '%'; }
    if (!reached && st.pct >= 85) {
      reached = true; S.viewDone = true;
      const names = Object.entries(st.names).filter(([k]) => OPTS.includes(k)).sort((a, b) => b[1] - a[1]);
      S.viewRight = names.length ? names[0][0] : '太平洋'; save();
      $('#vmsg').innerHTML = `<div class="fb ok">太厲害了！你眼前有 ${st.pct}% 都是海洋。</div>`; viewQ();
    } else if (!reached) $('#vmsg').innerHTML = st.pct >= 70 ? `<div class="fb info">快到了！再轉一點點。</div>` : '';
  };
  let pend = false; globe.o.onRotate = g => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; upd(g); }); };
  paint(globe.stats()); upd(globe);
}

function chart(h) {
  const W = 320, H = 170, L = 34, R = 12, T = 12, B = 26, n = h.length;
  const xs = i => L + (n <= 1 ? 0 : i / (n - 1)) * (W - L - R), ys = v => T + (1 - v / 100) * (H - T - B);
  const ticks = [0, 25, 50, 75, 100];
  const line = n ? h.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ') : '';
  const area = n > 1 ? `${line} L${xs(n - 1).toFixed(1)} ${ys(0)} L${xs(0)} ${ys(0)}Z` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="海洋比例隨拋接次數的變化">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--rule)" stroke-width="1"/><text x="${L - 6}" y="${ys(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}%</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${ys(71)}" y2="${ys(71)}" stroke="var(--coral)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${ys(71) - 5}" text-anchor="end" font-size="10.5" fill="var(--coral)">科學家測量：約 71%</text>
    ${area ? `<path d="${area}" fill="var(--sea)" opacity=".12"/>` : ''}
    ${line ? `<path d="${line}" fill="none" stroke="var(--sea)" stroke-width="2.2" stroke-linejoin="round"/>` : ''}
    ${n ? `<circle cx="${xs(n - 1)}" cy="${ys(h[n - 1])}" r="4" fill="var(--sea)"/>` : `<text x="${(L + W - R) / 2}" y="${H / 2}" text-anchor="middle" font-size="12" fill="var(--muted)">拋出地球儀後，這裡會出現折線</text>`}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">第 1 次</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--muted)">第 ${Math.max(n, 1)} 次</text>
  </svg>`;
}

        const p = UNITS[k].progress(); const done = p.done >= p.total;
        return `<button class="lesson open" data-u="${k}"><span class="no">${no}</span><span>${t}</span><span class="pg ${done ? 'done' : ''}">${done ? '完成' : p.done ? `${p.done}/${p.total} 站` : '開始'}</span></button>`; }).join('')}</section>`).join('')}</div>`;
  const saveName = () => { const v = $('#homeName').value.trim(); if (v) { setName(v); $('#who').textContent = `調查員：${v}`; } return v; };
  $('#homeName').onchange = saveName;
  $('#startBtn').onclick = () => { if (!saveName()) { $('#hh').textContent = '請先寫上你的名字。'; $('#homeName').focus(); return; } location.hash = UNITS.u21.progress().done > 0 && UNITS.u11.progress().done >= UNITS.u11.progress().total ? 'u21' : 'u11'; };
  $$('[data-u]').forEach(b => b.onclick = () => { saveName(); location.hash = b.dataset.u; });
}
let current = null;
function route() {
  const h = (location.hash || '').replace('#', '');
  $$('.ov').forEach(o => o.remove());
  if (current && current.stop) current.stop();
  if (UNITS[h]) {
    current = UNITS[h]; $('#home').hidden = true; $('#unitView').hidden = false; $('#homeBtn').hidden = false; $$('.unit-only').forEach(b => b.hidden = false);
    current.start(); AI.showChat(true);
  } else { current = null; AI.showChat(false); AI.setContext(null); showHome(); }
  window.scrollTo(0, 0);
}
$('#homeBtn').onclick = () => { location.hash = 'home'; };
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
